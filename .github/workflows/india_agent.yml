name: India Swing Trading Agent

on:
  schedule:
    - cron: '45 2 * * 1-5'    # 8:15 AM IST — 1hr before open
    - cron: '45 4 * * 1-5'    # 10:15 AM IST
    - cron: '45 6 * * 1-5'    # 12:15 PM IST
    - cron: '45 8 * * 1-5'    # 2:15 PM IST
  workflow_dispatch:

# Allow workflow to commit trade_log.csv back to repo
permissions:
  contents: write

# Runs are triggered at exact times by an external scheduler (cron-job.org calling
# workflow_dispatch) because GitHub's own schedule starts runs 2-5 hours late.
# If one run overlaps the next, queue it rather than cancel the one in progress
# (a cancelled run loses its trade-log update).
concurrency:
  group: india-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 115

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run India trading agent
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:           ${{ secrets.CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python india_swing_agent.py

      - name: Commit trade log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_log.csv positions.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📊 India trade log $(date +'%Y-%m-%d %H:%M UTC')"
          # Pull first: the user edits positions.csv from GitHub, and a commit made while
          # this run was scanning would otherwise reject the push and lose this run's log.
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
